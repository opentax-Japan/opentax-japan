<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- このサイトのファイル以外は読み込まない・通信しない。申告書一式の表示（srcdoc）のためだけに style の inline を許す -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' about: blob:; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>申告書一式 - OpenTax</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>申告書一式</h1>
  <p>決算書（会計ソフトの残高試算表）から、法人税の別表 → 消費税 → 概況書 → 決算書 → 内訳書 → 地方税 を順に作って並べます。
    計算はブラウザの中だけで行い、どこにも送りません。<a href="index.html">入力して計算する画面へ</a></p>
</header>
<main>
  <div id="status" class="status" role="status">準備しています…</div>
  <section class="toolbar">
    <button type="button" id="demo" class="primary" disabled>デモの会社（架空）の決算書を入れて作る</button>
  </section>
  <p class="note">デモの会社: オープン商事株式会社（架空。東京都千代田区・事務用品の卸売・赤字）。決算書・月次推移表・給与の記録・概況書と消費税の入力は、すべて架空の見本です。</p>
  <section id="out" hidden>
    <div class="row">
      <button type="button" id="open-tab">別のタブで開く（印刷はそこから）</button>
      <button type="button" id="save">HTML で保存</button>
    </div>
    <iframe id="report" title="申告書一式" sandbox="allow-same-origin"></iframe>
  </section>
</main>
<script src="report.js"></script>
</body>
</html>
