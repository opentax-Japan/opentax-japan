[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentax-japan"
version = "0.1.0"
description = "Open-source tax filing engine for Japanese corporate and local taxes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opentax = "opentax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
